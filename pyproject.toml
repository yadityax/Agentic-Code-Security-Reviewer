[project]
name = "agentic-security-reviewer"
version = "0.1.0"
description = "Autonomous GitHub PR security reviewer: scanners for evidence, agents for reasoning, verification before remediation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "structlog>=24.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "mcp>=2.2.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures", "benchmarks", "migrations/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["E501", "S603", "S607", "S101", "S108", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
markers = ["integration: needs Docker, Postgres and Redis (make up)"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[[tool.mypy.overrides]]
module = "mcp_server.*"
disallow_untyped_decorators = false
